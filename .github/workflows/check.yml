name: Check OpenTonton
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Japanese screenshot fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Check timeline in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/opentonton-browser" --ignore-scripts --no-audit --no-fund --registry https://npm.flatt.tech/ playwright-core@1.62.1
          PLAYWRIGHT_CORE="$RUNNER_TEMP/opentonton-browser/node_modules/playwright-core" CHROME_BIN="$(command -v google-chrome)" node tests/timeline.browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: compact-answer-timeline-previews
          path: preview/*.png
          retention-days: 7
